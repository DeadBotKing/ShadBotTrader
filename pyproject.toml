[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ShadBotTrader"
version = "0.1.0"
description = "ShadBotTrader - Enterprise AI Trading Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "PyWavelets>=1.5",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "mypy>=1.8",
    "pytest>=8.0",
    "ruff>=0.4",
]
ai = [
    "tensorflow>=2.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["ShadBotTrader"]

[tool.black]
line-length = 100
target-version = ["py310"]
extend-exclude = "legacy"

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
ignore_missing_imports = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
